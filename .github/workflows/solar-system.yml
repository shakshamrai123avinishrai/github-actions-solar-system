name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest

    container:        # added
      image: 'node:20' # added

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # - name: Setup NodeJS Version
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20

      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: '${{ runner.os }}-node-modules-${{ hashFiles(''package-lock.json'') }}'

      - name: Install Dependencies
        run: npm install

      - name: Unit Testing
        run: npm test

      - name: Archive Test Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-Test-Result
          path: test-results.xml
 dev-deploy:
      runs-on: ubuntu-latest
      needs:
       - docker
      environment:
        name: development
      steps:
      - name: install cluster
        uses: helm/kind-action@v1
      - run: |
          sleep 60
          kubectl -n kube-system get pod
          set +e
          REPO_OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          kubectl run solar --image ghcr.io/${REPO_OWNER_LC}/solar-system:${{ github.sha }} \
            --env MONGO_URI=${{ env.MONGO_URI}} \
            --env MONGO_USERNAME=${{ env.MONGO_USERNAME}} \
            --env MONGO_PASSWORD=${{ env.MONGO_PASSWORD}}
          set -e
          echo "kubectl returned $?"
          kubectl -n default get pod
          sleep 10
